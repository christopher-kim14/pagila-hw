name: tests
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: docker
      run: |
        # run the database in docker container
        # (GitHub's runners ship Docker Compose v2, so the command is
        # `docker compose`; the old `docker-compose` binary is no longer installed)
        docker compose up -d --build

        # verify that it is running successfully
        docker ps -a

        # wait until the pagila data has finished loading;
        # during initialization postgres only listens on a unix socket,
        # so a TCP connection succeeds only once the data load is complete
        for i in $(seq 1 120); do
          if docker compose exec -T pg pg_isready -h 127.0.0.1 -q; then
            break
          fi
          sleep 2
        done

        # run the tests
        docker compose exec -T pg ./run_tests.sh
